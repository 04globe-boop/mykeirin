name: extra

# Kドリームス・オッズパークのページ（走り評・記者評価・選手コメント・レース後談話）の収集。
# 月ごと（stride で連鎖、2022-01 まで）と、毎朝の前日分（schedule）の2通り。
on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 06:17 JST に前日分
  workflow_dispatch:
    inputs:
      month:
        description: "収集する月（YYYY-MM）。空なら前日1日分"
        required: false
        default: ""
      stride:
        description: "連鎖の間隔（か月）。0 なら連鎖しない"
        required: false
        default: "0"
      attempt:
        description: "同じ月の再開回数（自動で増える）"
        required: false
        default: "1"
      day:
        description: "日次の対象日 YYYY-MM-DD（空なら前日、過去の結果再取得にも使用）"
        required: false
        default: ""

concurrency:
  group: extra-${{ github.event.inputs.month || 'daily' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Tokyo
  DATA_REPO: ${{ github.repository_owner }}/mykeirin2
  TAG: extra
  FIRST_MONTH: "2022-01"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      day: ${{ steps.t.outputs.day }}
      ym: ${{ steps.t.outputs.ym }}
    env:
      GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      MONTH: ${{ github.event.inputs.month }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Decide target
        id: t
        env:
          DAY_INPUT: ${{ github.event.inputs.day }}
        run: |
          if [ -n "$MONTH" ]; then
            echo "args=--month $MONTH" >> "$GITHUB_OUTPUT"; echo "ym=$(echo $MONTH | tr -d '-')" >> "$GITHUB_OUTPUT"
          else
            D=$(python -c "from datetime import date,timedelta; import os; print(date.fromisoformat(os.environ['DAY_INPUT']) if os.environ.get('DAY_INPUT') else date.today()-timedelta(days=1))")
            echo "args=--date $D" >> "$GITHUB_OUTPUT"
            echo "ym=${D:0:4}${D:5:2}" >> "$GITHUB_OUTPUT"
            echo "day=${D//-/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download existing file (resume)
        run: |
          mkdir -p extra
          gh release download "$TAG" --repo "$DATA_REPO" -p "extra_${{ steps.t.outputs.ym }}.jsonl.gz" -D extra --clobber 2>/dev/null || echo "no existing file"

      - name: Collect
        run: python logger/collect_extra.py ${{ steps.t.outputs.args }} --out-dir extra --max-minutes 320 --status-file status.json

      - name: Upload
        if: always()
        run: |
          gh release view "$TAG" --repo "$DATA_REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$DATA_REPO" --title "extra" --notes "Kドリームス・オッズパークの走り評・記者評価・選手コメント・レース後談話（月ごとのファイル）"
          for F in extra/extra_*.jsonl.gz; do
            [ -e "$F" ] && gh release upload "$TAG" "$F" --repo "$DATA_REPO" --clobber
          done

      - name: Chain next run
        if: success() && github.event.inputs.month != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STRIDE: ${{ github.event.inputs.stride }}
          ATTEMPT: ${{ github.event.inputs.attempt }}
        run: |
          STATE=$(python -c "import json;print(json.load(open('status.json'))['state'])" 2>/dev/null || echo unknown)
          echo "state=$STATE month=$MONTH stride=$STRIDE attempt=$ATTEMPT"
          if [ "$STATE" = "time_limit" ]; then
            if [ "$ATTEMPT" -lt 4 ]; then
              gh api -X POST "repos/${{ github.repository }}/actions/workflows/extra.yml/dispatches" \
                -f ref=main -f "inputs[month]=$MONTH" -f "inputs[stride]=$STRIDE" -f "inputs[attempt]=$((ATTEMPT+1))"
            else
              echo "attempt limit reached; stop"
            fi
          elif [ "$STATE" = "finished" ] && [ "$STRIDE" -gt 0 ]; then
            NEXT=$(python -c "y,m=map(int,'$MONTH'.split('-'));t=y*12+m-1-$STRIDE;print(f'{t//12:04d}-{t%12+1:02d}')")
            if [[ "$NEXT" < "$FIRST_MONTH" ]]; then
              echo "reached $FIRST_MONTH; chain ends"
            else
              gh api -X POST "repos/${{ github.repository }}/actions/workflows/extra.yml/dispatches" \
                -f ref=main -f "inputs[month]=$NEXT" -f "inputs[stride]=$STRIDE" -f "inputs[attempt]=1"
            fi
          fi

  settle:
    needs: collect
    if: ${{ always() && needs.collect.outputs.day != '' && github.event.inputs.month == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: research-state-writer
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      TARGET_DAY: ${{ needs.collect.outputs.day }}
      TARGET_YM: ${{ needs.collect.outputs.ym }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Download observed result sources
        run: |
          mkdir -p extra nk
          gh release download extra --repo "$DATA_REPO" -p "extra_${TARGET_YM}.jsonl.gz" -D extra --clobber || echo "K source file unavailable; audit will retain the failure"
          gh release download nk-results --repo "$DATA_REPO" -p "nk_results_${TARGET_YM}.jsonl.gz" -D nk --clobber || echo "NK fallback unavailable; audit will retain missing results"
      - name: Settle verified observed results
        id: settle
        run: python logger/research_assets.py settle --repo "$DATA_REPO" --day "$TARGET_DAY" --extra "extra/extra_${TARGET_YM}.jsonl.gz" --nk "nk/nk_results_${TARGET_YM}.jsonl.gz"
      - name: Preserve and publish state
        id: publish
        if: always()
        run: python logger/research_assets.py upload --repo "$DATA_REPO" --history
      - name: Audit daily coverage
        if: always()
        env:
          SETTLE_OUTCOME: ${{ steps.settle.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          ARGS=()
          [ "$SETTLE_OUTCOME" = success ] || ARGS+=(--failure results:settlement_job_failed)
          [ "$PUBLISH_OUTCOME" = success ] || ARGS+=(--failure transport:canonical_publication_failed)
          python logger/research_health.py --data-dir data --day "$TARGET_DAY" --extra "extra/extra_${TARGET_YM}.jsonl.gz" "${ARGS[@]}"
      - name: Publish private health and request incident processing
        if: always()
        run: python logger/research_health_publish.py publish --repo "$DATA_REPO" --report "data/forward_health_${TARGET_DAY}.json" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Mark operational failures after preservation
        if: always()
        run: |
          python - <<'PY'
          import json,os
          report=json.load(open('data/forward_health_'+os.environ['TARGET_DAY']+'.json'))
          if report['status']!='healthy': raise SystemExit('Operational incidents recorded in private health report')
          PY
