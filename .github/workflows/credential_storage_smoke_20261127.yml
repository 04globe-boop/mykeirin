name: private credential storage smoke 20261127
on:
  push:
    branches: [codex/credential-storage-smoke-20261127]
    paths: ['.github/workflows/credential_storage_smoke_20261127.yml']
permissions:
  contents: read
env:
  DATA_REPO: 04globe-boop/mykeirin2
jobs:
  write_readback:
    if: github.repository == '04globe-boop/mykeirin' && github.ref == 'refs/heads/codex/credential-storage-smoke-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - name: Write and read back an isolated non-data receipt
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$DATA_REPO" --jq 'select(.private == true and .full_name == "04globe-boop/mykeirin2") | .id' > repo-id
          test -s repo-id
          tag="ops-credential-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --repo "$DATA_REPO" --title "Storage credential write check" --notes "Read/write validation after November storage incident. Receipt only, no racing data." --latest=false >/dev/null
          mkdir expected downloaded
          printf '{"schema":"ops-storage-credential-proof-v1","run_id":"%s","attempt":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > expected/proof.json
          gh release upload "$tag" expected/proof.json --repo "$DATA_REPO" >/dev/null
          gh release download "$tag" --repo "$DATA_REPO" --pattern proof.json --dir downloaded
          cmp expected/proof.json downloaded/proof.json
          gh release view "$tag" --repo "$DATA_REPO" --json tagName,publishedAt,assets --jq '{tag: .tagName, published_at: .publishedAt, asset_count: (.assets | length)}'
          echo 'PRIVATE_RELEASE_WRITE_AND_READBACK_OK'
