name: storage credential health

on:
  schedule:
    - cron: "35 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == '04globe-boop/mykeirin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check private storage reading and recorded expiry
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO_TOKEN_EXPIRES_UTC: ${{ vars.DATA_REPO_TOKEN_EXPIRES_UTC }}
        run: python3 logger/credential_health.py
