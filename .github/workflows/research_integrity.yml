name: collector-research-integrity
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tests/test_logger.py
      - run: python -m unittest discover -s tests -p test_research_assets.py -v
